name: libara
description: >-
  Attributed Range Algebra: overlapping markup as ranges over a persistent,
  editable sequence, with constructors, queries, layered documents, and JSON.
version: 0.1.0
repository: https://github.com/libdbm/libara
topics:
  - markup
  - text
  - parsing
  - editor
  - data-structures

environment:
  sdk: ^3.13.0

dependencies:
  characters: ^1.4.0

dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.0.0
  petitparser: ^7.1.0
  test: ^1.25.0
